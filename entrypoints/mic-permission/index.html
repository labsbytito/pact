<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pact microphone</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fbfbfa;
        color: #0d0d0d;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #161616;
          color: #ececec;
        }
      }
      main {
        width: min(100%, 420px);
        display: grid;
        gap: 14px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #5d5d5d;
      }
      @media (prefers-color-scheme: dark) {
        p {
          color: #a8a8a8;
        }
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 12px;
        min-height: 44px;
        padding: 10px 14px;
        cursor: pointer;
        background: #0d0d0d;
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        button {
          background: #f5f5f5;
          color: #0d0d0d;
        }
      }
      button.secondary {
        background: transparent;
        color: inherit;
        border: 1px solid rgba(127, 127, 127, 0.35);
      }
      button.hidden {
        display: none;
      }
      .row {
        display: grid;
        gap: 8px;
      }
      .status {
        font-size: 13px;
        min-height: 1.2em;
      }
      .ok {
        color: #1e8e3e;
      }
      .err {
        color: #d93025;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Allow the microphone</h1>
      <p>
        Chrome can only show the microphone prompt on an extension page, not
        inside the side panel. Allow access once here, then return to Pact to
        dictate.
      </p>
      <div class="row">
        <button id="allow" type="button">Allow microphone</button>
        <button id="settings" class="secondary hidden" type="button">
          Open mic settings
        </button>
        <button id="close" class="secondary" type="button">Close</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
