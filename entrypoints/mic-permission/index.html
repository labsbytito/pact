<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Pact microphone</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fcfcfc;
        color: #1c1c1c;
        font-family: system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #121212; color: #f5f5f5; }
      }
      main { width: min(100%, 420px); display: grid; gap: 12px; }
      h1 { margin: 0; font-size: 15px; font-weight: 600; }
      p { margin: 0; line-height: 1.45; font-size: 13px; color: #646464; }
      @media (prefers-color-scheme: dark) { p { color: #a8a8a8; } }
      button {
        font: inherit;
        border: 0;
        border-radius: 8px;
        height: 32px;
        padding: 0 12px;
        cursor: pointer;
        background: #1c1c1c;
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        button { background: #f5f5f5; color: #121212; }
      }
      button.secondary { background: transparent; color: inherit; border: 1px solid rgba(127, 127, 127, 0.35); }
      button.hidden { display: none; }
      .row { display: grid; gap: 8px; }
      .status { font-size: 13px; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <main>
      <h1>Allow the microphone</h1>
      <p>Chrome shows the microphone prompt on this page, then you can dictate in Pact.</p>
      <div class="row">
        <button id="allow" type="button">Allow microphone</button>
        <button id="settings" class="secondary hidden" type="button">Open mic settings</button>
        <button id="close" class="secondary" type="button">Close</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
